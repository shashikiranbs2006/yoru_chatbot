services:
  chroma:
    image: chromadb/chroma:latest
    container_name: yoru-chroma
    ports:
      - "8000:8000"
    volumes:
      - ./chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
